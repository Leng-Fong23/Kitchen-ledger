<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Kitchen Ledger</title>
<meta name="theme-color" content="#15805A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kitchen">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon-192.png">
<script>if('serviceWorker' in navigator)addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){});});</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  /* Concept: a market-stall ledger. Quiet green paper, with yellow price tags carrying every cost. */
  --bg:#F1F7F2; --surface:#FFFFFF; --ink:#14271F; --muted:#5A7166;
  --line:#DAE7DF; --line-strong:#B2CBBD;
  --accent:#15805A; --accent-ink:#FFFFFF; --accent-soft:#DDF3E8; --accent-deep:#0E5C41;
  --tag:#FFD65C; --tag-ink:#4A3400;
  --danger:#B8392B; --danger-soft:#FCE7E3;
  --bar:#BDE3CE; --scrim:rgba(8,30,20,.4);
  --hero-a:#D5F0E2; --hero-b:#FFFFFF;
  --c-bf:#F2A93B; --c-lu:#2FA876; --c-di:#4B7FD1; --c-sn:#EE6F57;
  --font-display:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1914; --surface:#13261E; --ink:#E7F4EC; --muted:#8FAC9D;
    --line:#21392F; --line-strong:#38564A;
    --accent:#46C894; --accent-ink:#04251A; --accent-soft:#17392B; --accent-deep:#7FE0B8;
    --tag:#F3CD6A; --tag-ink:#2E2200;
    --danger:#FF9482; --danger-soft:#3E201B;
    --bar:#24473A; --scrim:rgba(0,0,0,.6);
    --hero-a:#173A2C; --hero-b:#13261E;
    --c-bf:#F6C36A; --c-lu:#55D6A0; --c-di:#86ABF2; --c-sn:#FF9680;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1914; --surface:#13261E; --ink:#E7F4EC; --muted:#8FAC9D;
  --line:#21392F; --line-strong:#38564A;
  --accent:#46C894; --accent-ink:#04251A; --accent-soft:#17392B; --accent-deep:#7FE0B8;
  --tag:#F3CD6A; --tag-ink:#2E2200;
  --danger:#FF9482; --danger-soft:#3E201B;
  --bar:#24473A; --scrim:rgba(0,0,0,.6);
  --hero-a:#173A2C; --hero-b:#13261E;
  --c-bf:#F6C36A; --c-lu:#55D6A0; --c-di:#86ABF2; --c-sn:#FF9680;
  color-scheme:dark;
}
html,body{height:100%}
*,*::before,*::after{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--font-body); font-size:16px; line-height:1.4;
  padding-block:0;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  -webkit-text-size-adjust:100%;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0 6px}
.brand{font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:-.01em;color:var(--accent-deep)}
.top-r{display:flex;align-items:center;gap:2px}
.main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:6px 0 20px}
.view{display:flex;flex-direction:column;gap:14px;min-width:0}
.view-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.view-title{font-family:var(--font-display);font-size:26px;font-weight:700;margin:0;text-wrap:balance}

.sync{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 8px;border:0;background:none;color:var(--muted);font-size:12px;font-weight:500;cursor:pointer;border-radius:10px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync[data-s="saved"] .dot{background:var(--accent)}
.sync[data-s="saving"] .dot{background:var(--tag)}
.sync[data-s="error"] .dot{background:var(--danger)}
.sync[data-s="error"]{color:var(--danger)}
.sync[data-s="local"] .dot{background:transparent;box-shadow:inset 0 0 0 2px var(--muted)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:0}
.pad{padding:14px}
.list{overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:10px 14px;background:none;border:0;text-align:left;cursor:pointer;color:inherit}
.row+.row{border-top:1px solid var(--line)}
.row:hover{background:var(--accent-soft)}
.grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.nm{font-weight:600;overflow-wrap:anywhere}
.meta{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.tagcol{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.per{font-size:11px;color:var(--muted)}

.tag{--n:9px;--hole:4px;display:inline-flex;align-items:baseline;gap:4px;position:relative;white-space:nowrap;
  font-family:var(--font-mono);font-weight:500;font-size:13px;font-variant-numeric:tabular-nums;
  background:var(--tag);color:var(--tag-ink);
  padding:4px 9px 4px calc(var(--n) + 8px);
  clip-path:polygon(var(--n) 0,100% 0,100% 100%,var(--n) 100%,0 50%);border-radius:0 5px 5px 0}
.tag::before{content:"";position:absolute;left:calc(var(--n) + 2px);top:50%;width:var(--hole);height:var(--hole);margin-top:calc(var(--hole) / -2);border-radius:50%;background:var(--surface)}
.tag.lg{--n:16px;--hole:7px;font-size:32px;line-height:1.1;padding:8px 18px 8px calc(var(--n) + 14px)}

.btn{min-height:44px;padding:0 18px;border-radius:12px;border:1px solid transparent;background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--line-strong)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.small{min-height:38px;padding:0 12px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:default}
.icon{width:44px;height:44px;display:grid;place-items:center;background:none;border:0;border-radius:12px;color:var(--ink);cursor:pointer;flex:none}
.icon:hover{background:var(--accent-soft)}
.icon.sm{width:36px;height:36px}

.datebar{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:4px}
.datepick{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:48px;cursor:pointer;border-radius:12px}
.datepick:hover{background:var(--accent-soft)}
.dlabel{font-family:var(--font-display);font-size:21px;font-weight:700}
.dsub{font-size:12px;color:var(--muted);font-weight:500}
.datepick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}

.totalcard{padding:16px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;background:linear-gradient(135deg,var(--hero-a),var(--hero-b))}
.totalcard .tag::before{background:var(--hero-a)}
.lbl{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.stats{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--muted)}
.stats b{font-family:var(--font-mono);font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}

.chart{padding:14px 14px 10px;display:flex;flex-direction:column;gap:8px}
.bars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;align-items:end}
.bar{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:2px 0;cursor:pointer;color:var(--muted);min-width:0}
.bar .v{font-family:var(--font-mono);font-size:11px;height:14px;font-variant-numeric:tabular-nums}
.bar .col{width:100%;height:64px;display:flex;align-items:flex-end;border-bottom:1px solid var(--line-strong)}
.bar .fill{width:100%;border-radius:4px 4px 0 0;background:var(--bar)}
.bar[aria-pressed="true"] .fill{background:var(--accent)}
.bar[aria-pressed="true"]{color:var(--ink);font-weight:600}
.bar .d{font-size:11px;line-height:1.15;text-align:center}

.slot-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 10px 10px 14px}
.slot-head h2{display:flex;align-items:center;gap:9px;margin:0;font-family:var(--font-display);font-size:18px;font-weight:700}
.sdot{width:11px;height:11px;border-radius:50%;flex:none}
.s-breakfast{background:var(--c-bf)}
.s-lunch{background:var(--c-lu)}
.s-dinner{background:var(--c-di)}
.s-snack{background:var(--c-sn)}
.slot-r{display:flex;align-items:center;gap:10px}
.slot-empty{margin:0;padding:0 14px 14px;font-size:14px;color:var(--muted)}
.slot .list{border-top:1px solid var(--line)}

.thumb{width:48px;height:48px;border-radius:10px;object-fit:cover;flex:none;background:var(--accent-soft)}
.thumb.broken{visibility:hidden}
.photo{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg)}
.photo img{display:block;width:100%;max-height:280px;object-fit:cover}
.photo-actions{display:flex;gap:8px;padding:8px;background:var(--surface)}
.addphoto{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;width:100%;border:1.5px dashed var(--line-strong);border-radius:12px;background:none;color:var(--accent);font-weight:600;cursor:pointer}
.addphoto:hover{background:var(--accent-soft)}
.search{display:block}
.empty{padding:24px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:12px}
.empty h2{margin:0;font-family:var(--font-display);font-size:20px;color:var(--ink);text-wrap:balance}
.empty p{margin:0;max-width:34ch}
.empty .btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}

.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--bg)}
.tabs button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:58px;padding:8px 4px;border:0;background:none;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer}
.tabs button[aria-current="page"]{color:var(--accent)}
.tabs button[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:50%;width:30px;height:3px;margin-left:-15px;border-radius:0 0 3px 3px;background:var(--accent)}

/* calendar */
.cal{padding:12px;display:flex;flex-direction:column;gap:10px}
.cal-head{display:grid;grid-template-columns:44px 1fr 44px;align-items:center}
.cal-title{text-align:center;font-family:var(--font-display);font-size:20px;font-weight:700}
.cal-wd,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-wd span{text-align:center;font-size:11px;font-weight:600;color:var(--muted)}
.cal-day{position:relative;aspect-ratio:1;min-width:0;padding:0;border:1px solid var(--line);border-radius:10px;background:var(--bg);overflow:hidden;cursor:pointer;color:var(--ink)}
.cal-day.pad0{visibility:hidden;pointer-events:none}
.cal-day.has{background:var(--accent-soft);border-color:var(--line-strong)}
.cal-day.today{box-shadow:inset 0 0 0 2px var(--tag)}
.cal-day[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:1px}
.cal-n{position:absolute;top:3px;left:4px;z-index:2;font-family:var(--font-mono);font-size:11px;font-weight:500;line-height:1}
.cal-day.ph .cal-n{background:rgba(0,0,0,.6);color:#fff;padding:2px 4px;border-radius:6px}
.cal-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cal-img.broken{visibility:hidden}
.cal-chk{position:absolute;right:4px;bottom:4px;color:var(--accent)}
.cal-more{position:absolute;right:3px;bottom:3px;z-index:2;font-family:var(--font-mono);font-size:10px;background:var(--tag);color:var(--tag-ink);padding:1px 4px;border-radius:6px}
.cal-legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.cal-legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:5px;border:1px solid var(--line-strong)}
.streak{display:flex;align-items:center;gap:12px;padding:12px 14px;background:linear-gradient(135deg,var(--accent-soft),var(--surface))}
.streak .fl{font-size:30px;line-height:1;flex:none}
.streak .sb{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.streak .sn{font-family:var(--font-display);font-size:18px;font-weight:700}
.streak .sm{font-size:13px;color:var(--muted)}
.streak .best{font-size:11px;color:var(--muted);text-align:right;flex:none}
.streak .best b{display:block;font-family:var(--font-mono);font-size:15px;font-weight:500;color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;max-width:min(92vw,420px);padding:12px 16px;border-radius:14px;background:var(--accent-deep);color:var(--accent-ink);font-weight:600;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:up .25s ease-out}
/* skins */

function addDays(s,n){var d=parseD(s);d.setDate(d.getDate()+n);return ymd(d);}
function fmtDay(s){try{return parseD(s).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}).replace(',','');}catch(e){return s;}}
function plural(n,w){return n+' '+w+(n===1?'':'s');}

/* ---------- cost maths ---------- */
function ingById(id){for(var i=0;i<S.ingredients.length;i++){if(S.ingredients[i].id===id)return S.ingredients[i];}return null;}
function recipeById(id){for(var i=0;i<S.recipes.length;i++){if(S.recipes[i].id===id)return S.recipes[i];}return null;}
function unitPrice(i){var q=num(i.qty)*UNITS[i.unit].b;return q>0?num(i.price)/q:0;}
function lineCost(l){var i=ingById(l.ing);if(!i||!UNITS[l.unit]||!UNITS[i.unit])return 0;if(UNITS[l.unit].f!==UNITS[i.unit].f)return 0;return num(l.qty)*UNITS[l.unit].b*unitPrice(i);}
function recipeCost(r){return r.lines.reduce(function(a,l){return a+lineCost(l);},0);}
function perServing(r){return recipeCost(r)/(num(r.servings)||1);}
function unitPriceLabel(i){var u=unitPrice(i),f=UNITS[i.unit].f;if(f==='mass')return money(u*1000)+' / kg';if(f==='vol')return money(u*1000)+' / L';return money(u)+' / pc';}
function defUnit(i){var f=UNITS[i.unit].f;return f==='mass'?'g':f==='vol'?'ml':'pcs';}
function usedIn(ingId){return S.recipes.filter(function(r){return r.lines.some(function(l){return l.ing===ingId;});});}

function monthEntries(k){return S.months[k]||[];}
function dayEntries(d){return monthEntries(d.slice(0,7)).filter(function(e){return e.date===d;});}
function dayTotal(d){return dayEntries(d).reduce(function(a,e){return a+num(e.cost);},0);}
function findEntry(id){for(var k in S.months){var a=S.months[k];for(var i=0;i<a.length;i++){if(a[i].id===id)return a[i];}}return null;}
function defaultSlot(){var h=new Date().getHours();return h<10?'Breakfast':h<15?'Lunch':h<18?'Snack':h<22?'Dinner':'Snack';}

/* ---------- persistence ---------- */
function setSync(s){S.syncState=s;renderSync();}
function renderSync(){
  var b=$('#sync'),t=$('#syncTxt');if(!b)return;
  var map={loading:'Loading',saving:'Saving…',saved:'Saved',local:'This device only',error:'Not saved · retry'};
  b.setAttribute('data-s',S.syncState);t.textContent=map[S.syncState]||'';
  b.title=S.syncState==='error'?(S.lastErr||''):'';
}
function docBody(id){
  if(id==='pantry')return {cur:S.cur,ingredients:S.ingredients,recipes:S.recipes,v:1};
  return {entries:S.months[id.slice(2)]||[]};
}
function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify({cur:S.cur,ingredients:S.ingredients,recipes:S.recipes,months:S.months}));}catch(e){}}
function loadLocal(){try{var raw=localStorage.getItem(LS_KEY);if(raw){var d=JSON.parse(raw);S.cur=d.cur==null?'RM':d.cur;S.ingredients=d.ingredients||[];S.recipes=d.recipes||[];S.months=d.months||{};}}catch(e){}}
function touch(id){
  dirty[id]=true;setSync('saving');clearTimeout(timers[id]);
  timers[id]=setTimeout(function(){flush(id);},450);
}
function anyBusy(){var k;for(k in dirty){if(dirty[k])return true;}for(k in inflight){if(inflight[k])return true;}return false;}
function flush(id){
  if(S.mode!=='cloud'){saveLocal();dirty[id]=false;if(!anyBusy())setSync('local');return;}
  if(inflight[id]){timers[id]=setTimeout(function(){flush(id);},300);return;}
  inflight[id]=true;dirty[id]=false;
  col.doc(id).set(docBody(id)).then(function(){
    inflight[id]=false;if(!anyBusy())setSync('saved');
  },function(e){
    inflight[id]=false;dirty[id]=true;setSync('error');
    S.lastErr=(e&&e.code==='quota_exceeded')?'Storage is full. Delete some old items to keep saving.':'Could not save. Check your connection and tap the status to retry.';
  });
}
function flushAll(){for(var id in dirty){if(dirty[id]){clearTimeout(timers[id]);flush(id);}}}

function applySnapshot(snap){
  snap.docs.forEach(function(d){
    var id=d.id;if(dirty[id]||inflight[id])return;
    var data=clone(d.data()||{});
    if(id==='pantry'){S.cur=data.cur==null?'RM':data.cur;S.ingredients=data.ingredients||[];S.recipes=data.recipes||[];}
    else if(id.indexOf('m-')===0){S.months[id.slice(2)]=data.entries||[];}
  });
  if(!snap.metadata.fromCache){S.ready=true;if(!anyBusy())setSync('saved');}
  else if(!S.readyTimer){S.readyTimer=setTimeout(function(){if(!S.ready){S.ready=true;render();}},2500);}
  render();
}
function goLocal(){
  S.mode='local';if(unsub){try{unsub();}catch(e){}}
  loadLocal();S.ready=true;setSync('local');render();
}
function init(){
  render();
  var go=function(){
    if(db&&uid){
      S.mode='cloud';col=db.collection('data/users/'+uid);
      try{unsub=col.onSnapshot(applySnapshot,function(){goLocal();});}catch(e){goLocal();}
    }else{goLocal();}
  };
  try{
    var c=window.claude;
    if(c&&c.use){
      c.use('assets').then(function(a){S.assets=a;},function(){});
      c.use('db').then(function(d){
        db=d;return c.use('user');
      }).then(function(u){
        return u?u.id():null;
      }).then(function(id){uid=id;go();},function(){go();});
    }else{go();}
  }catch(e){go();}
}

/* ---------- mutations ---------- */
function saveIngredient(ing){
  var i=S.ingredients.findIndex(function(x){return x.id===ing.id;});
  if(i>=0)S.ingredients[i]=ing;else S.ingredients.push(ing);
  touch('pantry');
}
function deleteIngredient(id){S.ingredients=S.ingredients.filter(function(x){return x.id!==id;});touch('pantry');}
function saveRecipe(r){
  var i=S.recipes.findIndex(function(x){return x.id===r.id;});
  if(i>=0)S.recipes[i]=r;else S.recipes.push(r);
  touch('pantry');
}
function deleteRecipe(id){var _r=recipeById(id);if(_r&&_r.photo)delAsset(_r.photo);S.recipes=S.recipes.filter(function(x){return x.id!==id;});touch('pantry');}
function removeEntryQuiet(id,touched){
  for(var k in S.months){var a=S.months[k];var i=a.findIndex(function(x){return x.id===id;});if(i>=0){a.splice(i,1);touched[k]=true;}}
}
function saveEntry(e){
  var before=streak(),t={};removeEntryQuiet(e.id,t);
  var mk=e.date.slice(0,7);(S.months[mk]=S.months[mk]||[]).push(e);t[mk]=true;
  Object.keys(t).forEach(function(k){touch('m-'+k);});
  var after=streak();if(after>before)toast((after>=3?'🔥 ':'')+after+'-day streak! '+streakMsg(after));
}
function deleteEntry(id){var old=findEntry(id);if(old&&old.photo)delAsset(old.photo);var t={};removeEntryQuiet(id,t);Object.keys(t).forEach(function(k){touch('m-'+k);});}

function shiftMonth(mk,n){var p=mk.split('-'),d=new Date(+p[0],+p[1]-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1);}
function loggedDates(){var o={};for(var k in S.months){S.months[k].forEach(function(e){o[e.date]=1;});}return o;}
function streak(){
  var all=loggedDates(),d=todayStr(),n=0;
  if(!all[d])d=addDays(d,-1);
  while(all[d]){n++;d=addDays(d,-1);}
  return n;
}
function coverPhoto(list){
  for(var i=0;i<SLOTS.length;i++){for(var j=0;j<list.length;j++){if(list[j].slot===SLOTS[i]&&list[j].photo)return list[j].photo;}}
  for(var k=0;k<list.length;k++){if(list[k].photo)return list[k].photo;}
  return '';
}
function viewCalendar(){

  var lead=(first.getDay()+6)%7,es=monthEntries(mk),by={},i,title=mk;

  h+=streakCard();

  h+='<div class="cal-wd" aria-hidden="true">'+['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(function(w){return '<span>'+w+'</span>';}).join('')+'</div><div class="cal-grid">';

    (de.length?'<div class="list" style="border-top:1px solid var(--line)">'+de.slice().sort(function(a,b){return SLOTS.indexOf(a.slot)-SLOTS.indexOf(b.slot);}).map(entryRow).join('')+'</div>':'<p class="slot-empty">Nothing logged on this day.</p>')+'</section>';
  return h+'</div>';

function longestStreak(){var ks=Object.keys(loggedDates()).sort(),best=0,run=0,prev='';ks.forEach(function(d){run=(prev&&addDays(prev,1)===d)?run+1:1;if(run>best)best=run;prev=d;});return best;}
function streakMsg(n){
  if(n>=100)return 'A hundred days! Absolutely legendary.';
  if(n>=30)return n+' days in a row. You are a true kitchen pro!';
  if(n>=14)return 'Two weeks strong. Impressive dedication!';
  if(n>=7)return 'A whole week! You are on fire.';
  if(n>=5)return n+' days straight. Fantastic consistency!';
  if(n===4)return '4 days in a row. Keep it going!';
  if(n===3)return '3 days straight. A habit is forming!';
  if(n===2)return '2 days in a row. Lovely rhythm!';
  if(n===1)return 'Day one done. Great start!';
  return 'Log a meal today to start a streak.';
}
function streakCard(){
  var n=streak(),b=Math.max(longestStreak(),n),all=loggedDates(),msg=streakMsg(n);
  if(n>0&&!all[todayStr()])msg+=' Log today to keep it alive.';
  return '<section class="card streak" aria-label="Check-in streak"><span class="fl" aria-hidden="true">'+(n>0?'🔥':'🌱')+'</span><div class="sb"><span class="sn">'+n+'-day streak</span><span class="sm">'+esc(msg)+'</span></div><div class="best">Best<b>'+b+'</b></div></section>';
}
function toast(msg){
  var old=$('.toast');if(old&&old.parentNode)old.parentNode.removeChild(old);
  var t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=msg;document.body.appendChild(t);
  setTimeout(function(){if(t.parentNode)t.parentNode.removeChild(t);},4000);
}
/* ---------- home feed ---------- */
function hsh(t){var h=0;for(var i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))|0;return Math.abs(h);}
function relDay(d){var t=todayStr();return d===t?'Today':d===addDays(t,-1)?'Yesterday':fmtDay(d);}
function safeUrl(u){u=String(u||'').trim();return /^https?:\/\//i.test(u)?u:'';}
function cookedCount(rid){var n=0;Object.keys(S.months).forEach(function(k){S.months[k].forEach(function(e){if(e.recipeId===rid)n++;});});return n;}
function homeItems(){
  var all=[],ck={},hasPh={},items=[];
  Object.keys(S.months).forEach(function(k){S.months[k].forEach(function(e){all.push(e);});});
  all.forEach(function(e){
    if(!e.recipeId)return;
    var c=ck[e.recipeId]||(ck[e.recipeId]={n:0,last:''});c.n++;if(e.date>c.last)c.last=e.date;if(e.photo)hasPh[e.recipeId]=1;
  });
  all.forEach(function(e){

  wrap.addEventListener('click',function(e){if(e.target.closest('[data-close]'))wrap.close();});

function twoStep(btn,label,run){

function resizeImage(file){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),im=new Image();
    im.onload=function(){
      var s=Math.min(1,1280/Math.max(im.naturalWidth,im.naturalHeight)),cv=document.createElement('canvas');
      cv.width=Math.max(1,Math.round(im.naturalWidth*s));cv.height=Math.max(1,Math.round(im.naturalHeight*s));
      cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);URL.revokeObjectURL(url);
      cv.toBlob(function(b){b?res(b):rej(new Error('encode'));},'image/jpeg',0.82);
    };
    im.onerror=function(){URL.revokeObjectURL(url);rej(new Error('decode'));};
    im.src=url;
  });
}

function mealSheet(opt){

  w.addEventListener('change',function(e){

/* ---------- settings ---------- */
function blobToDataUrl(b){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result);};r.onerror=function(){rej(r.error);};r.readAsDataURL(b);});}
function dataUrlToBlob(u){var p=String(u).split(','),m=/data:([^;]+)/.exec(p[0]),bin=atob(p[1]),n=bin.length,a=new Uint8Array(n);for(var i=0;i<n;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:m?m[1]:'image/jpeg'});}
function allPhotoIds(){
  var ids={};
  S.recipes.forEach(function(r){if(r.photo)ids[r.photo]=1;});
  Object.keys(S.months).forEach(function(k){S.months[k].forEach(function(e){if(e.photo)ids[e.photo]=1;});});
  return Object.keys(ids);
}
function exportBackup(btn){
  var lbl=btn.textContent,ids=allPhotoIds(),photos={};
  btn.disabled=true;btn.textContent='Preparing…';
  phDb().then(function(db){
    return Promise.all(ids.map(function(id){return new Promise(function(res){
      var rq=db.transaction('p','readonly').objectStore('p').get(id);
      rq.onsuccess=function(){if(rq.result){blobToDataUrl(rq.result).then(function(u){photos[id]=u;res();},function(){res();});}else res();};
      rq.onerror=function(){res();};
    });}));
  }).then(function(){
    var data={app:'kitchen-ledger',v:1,saved:new Date().toISOString(),data:{cur:S.cur,ingredients:S.ingredients,recipes:S.recipes,months:S.months},photos:photos};
    var blob=new Blob([JSON.stringify(data)],{type:'application/json'}),a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download='kitchen-ledger-backup-'+todayStr()+'.json';document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);if(a.parentNode)a.parentNode.removeChild(a);},3000);
    btn.disabled=false;btn.textContent=lbl;toast('Backup file created.');
  },function(){btn.disabled=false;btn.textContent=lbl;toast('Backup failed. Try again.');});
}
function importBackup(file){
  var rd=new FileReader();
  rd.onerror=function(){toast('Could not read that file.');};
  rd.onload=function(){
    var j;try{j=JSON.parse(rd.result);}catch(e){toast('That file is not a backup.');return;}
    var d=j&&j.app==='kitchen-ledger'?j.data:null;
    if(!d||!Array.isArray(d.ingredients)||!Array.isArray(d.recipes)||typeof d.months!=='object'||!d.months){toast('That is not a Kitchen Ledger backup.');return;}
    if(!window.confirm('Replace everything in the app with this backup?'))return;
    var ids=Object.keys(j.photos||{}),blobs={};
    ids.forEach(function(id){try{blobs[id]=dataUrlToBlob(j.photos[id]);}catch(e){}});
    phDb().then(function(db){return new Promise(function(res,rej){
      var tx=db.transaction('p','readwrite'),st=tx.objectStore('p');
      Object.keys(blobs).forEach(function(id){st.put(blobs[id],id);});
      tx.oncomplete=function(){res();};tx.onerror=tx.onabort=function(){rej(tx.error);};
    });}).then(function(){
      Object.keys(blobs).forEach(function(id){if(PH[id])URL.revokeObjectURL(PH[id]);PH[id]=URL.createObjectURL(blobs[id]);});
      S.cur=d.cur==null?'RM':d.cur;S.ingredients=d.ingredients;S.recipes=d.recipes;S.months=d.months;
      saveLocal();setSync('local');closeAll();render();toast('Backup restored.');
    },function(){toast('Could not restore. Storage may be full.');});
  };
  rd.readAsText(file);
}
function settingsSheet(){
  var hasEx=S.ingredients.some(function(i){return i.ex;})||S.recipes.some(function(r){return r.ex;});
  var where=S.mode==='cloud'?'Your recipes, prices and meals are saved to your account and open on any device you sign in on.':'Your meals, recipes and photos are saved on this phone, in this browser. Add the page to your Home Screen so it opens like an app, and back up now and then.';
  var cs=curSkin();
  var sk='<div><p class="skin-h">Theme</p><div class="skins" role="radiogroup" aria-label="Theme">'+SKINS.map(function(x){return '<button type="button" class="skin" role="radio" data-skin-pick="'+x[0]+'" aria-checked="'+(cs===x[0])+'"><span class="sw" data-skin="'+x[0]+'"><span class="sw-card"><i></i><b></b></span></span><span class="skin-n">'+x[1]+'</span></button>';}).join('')+'</div></div>';
  var body=sk+'<label class="field"><span>Currency symbol</span><input class="in" id="s-cur" autocomplete="off" maxlength="6" value="'+esc(S.cur)+'"></label>'+
    '<p class="hint">'+esc(where)+'</p>'+
    '<div class="field"><span>Back up</span><div class="btns" style="flex-wrap:wrap;gap:8px"><button class="btn ghost" type="button" id="s-bk">Back up to a file</button><button class="btn ghost" type="button" id="s-rs">Restore from a file</button></div><input type="file" id="s-rf" accept="application/json,.json" hidden></div>'+
    (hasEx?'<div><button class="btn ghost" type="button" id="s-ex">Remove example items</button></div>':'');
  var w=openSheet('Settings',body,'<div class="btns"><button class="btn" type="button" id="s-done">Done</button></div>');
  $('#s-cur',w).addEventListener('input',function(e){S.cur=e.target.value.trim();touch('pantry');render();});
  $('#s-done',w).addEventListener('click',function(){w.close();});
  $('#s-bk',w).addEventListener('click',function(){exportBackup(this);});
  $('#s-rs',w).addEventListener('click',function(){$('#s-rf',w).click();});
  $('#s-rf',w).addEventListener('change',function(e){var f=e.target.files&&e.target.files[0];e.target.value='';if(f)importBackup(f);});
  w.querySelectorAll('[data-skin-pick]').forEach(function(b){b.addEventListener('click',function(){
    applySkin(b.dataset.skinPick);
    w.querySelectorAll('[data-skin-pick]').forEach(function(o){o.setAttribute('aria-checked',String(o===b));});
  });});
  if(hasEx)$('#s-ex',w).addEventListener('click',function(){removeExamples();w.close();});
}

/* ---------- events ---------- */
$('#gear').innerHTML=ic.gear;
$('#tabs').addEventListener('click',function(e){
  var b=e.target.closest('[data-tab]');if(!b)return;
  S.tab=b.dataset.tab;if(S.tab==='cal')S.calMonth=S.date.slice(0,7);render();$('#main').scrollTop=0;
});
$('#gear').addEventListener('click',settingsSheet);
$('#sync').addEventListener('click',function(){if(S.syncState==='error')flushAll();});
$('#main').addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');if(!b)return;var a=b.dataset.a;
  if(a==='prev'){S.date=addDays(S.date,-1);render();}
  else if(a==='next'){S.date=addDays(S.date,1);render();}
  else if(a==='today'){S.date=todayStr();render();}
  else if(a==='pick-day'){S.date=b.dataset.d;render();}
  else if(a==='cal-prev'){S.calMonth=shiftMonth(S.calMonth,-1);render();}
  else if(a==='cal-next'){S.calMonth=shiftMonth(S.calMonth,1);render();}
  else if(a==='cal-day'){S.date=b.dataset.d;render();}
  else if(a==='cal-open'){S.tab='meals';render();$('#main').scrollTop=0;}
  else if(a==='add-meal')mealSheet({slot:b.dataset.slot});
  else if(a==='edit-entry')mealSheet({entryId:b.dataset.id});
  else if(a==='new-ing')ingredientSheet(null);
  else if(a==='edit-ing')ingredientSheet(b.dataset.id);
  else if(a==='new-recipe')recipeSheet(null);
  else if(a==='new-idea')recipeSheet(null,{idea:true});
  else if(a==='home-f'){S.hf=b.dataset.f;render();}
  else if(a==='home-open'){var ks=b.dataset.k;openItem(homeItems().filter(function(i){return i.key===ks;})[0]);}
  else if(a==='surprise'){
    var all=homeItems(),tr=all.filter(function(i){return i.kind==='try';}),pool=tr.length?tr:all;
    if(!pool.length)toast('Add a recipe idea first.');else openItem(pool[Math.floor(Math.random()*pool.length)]);
  }
  else if(a==='open-recipe')recipeDetail(b.dataset.id);
  else if(a==='goto-ing'){S.tab='ing';render();}
  else if(a==='examples')loadExamples();
});
$('#main').addEventListener('change',function(e){
  if(e.target.id==='datePick'&&e.target.value){S.date=e.target.value;render();}
});
$('#main').addEventListener('input',function(e){
  if(e.target.id!=='q')return;
  if(S.tab==='home'){S.q.home=e.target.value;$('#feed').innerHTML=feedHtml();return;}
  var l=$('#list');
  if(S.tab==='recipes'){S.q.recipes=e.target.value;l.innerHTML=recipeRows();}
  else{S.q.ing=e.target.value;l.innerHTML=ingRows();}
});
$('#main').addEventListener('error',function(e){var t=e.target;if(t&&t.classList&&(t.classList.contains('thumb')||t.classList.contains('cal-img')||(t.tagName==='IMG'&&t.closest&&t.closest('.post-img'))))t.classList.add('broken');},true);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')flushAll();});

PHOTOS_READY.then(init,init);
})();
</script>

</body></html>
